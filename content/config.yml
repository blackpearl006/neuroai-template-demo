# Site settings — edit this file plus the .md / .csv files in this folder.
# No coding needed: keep the 2-space indentation and put text in "quotes".
# Full walkthrough in HOWTO.md.

# Who / what
title:       "Anatomical Predictors of Fluid Reasoning"
titleAccent: "Fluid Reasoning"    # this word in the title shows in the accent colour
authors:     "John Doe, John Doe, John Doe, John Doe"
institution: "Your Institution"
year:        2026
repoUrl:     "https://github.com/blackpearl006/neuroai-template-demo"

# Browser tab + link previews
meta:
  title:       "Anatomical Predictors of Fluid Reasoning"
  description: "A compact 3D residual CNN predicts fluid reasoning scores from T1 MRI across 8 cohorts, with atlas-based saliency mapping the regions that drive each prediction."
  ogImage:     "og-image.png"    # a file in the /public folder
  twitter:     "@your_handle"
  url:         "https://blackpearl006.github.io/neuroai-template-demo/"

# Look & feel
theme:           light        # light | dark | gradient | clinical
fonts:           editorial    # apple | editorial | modern | display | clinical
# Tip: theme: clinical + fonts: clinical flips the whole site to a cool
# slate/teal "scanner" look (reticle eyebrows, scan-line dividers, IBM Plex).
fontScale:       md           # sm | md | lg | xl
showThemeToggle: true         # let readers switch theme / font live

# Hero (top of the page). Add  cover: "demo/brain-06.jpg"  for a banner image.
hero:
  badge: "8 cohorts · 9,340 scans"
  chips: ["HCP-YA", "HCP-D", "ABCD", "AOMIC-ID1000", "AOMIC-PIOP1", "NKI-RS", "PNC", "eNKI"]
  primaryCta:   { label: "Explore brain regions →", href: "#explorer" }
  secondaryCta: { label: "Paper & code",            href: "#resources" }
  # Hero brain figure — an instant glass-brain projection that anchors the page.
  # atlas = any key under public/assets/atlases (brainnetome, schaefer400, aal116,
  # glasser360, yeo7, …). Delete the whole `brain:` block for a text-only hero.
  brain:
    atlas:   brainnetome
    label:   "Brainnetome · 246 regions"
    caption: "Integrated-gradients saliency projected onto a glass brain — colour marks the regions that most drive the model’s prediction. Explore every atlas interactively below."

# Sections: order + on/off. Hide one with  enabled: false ; reorder by moving lines.
# nav = left-menu label (null hides it). Keep each id as-is.
# showcase is a catalogue of every component — off so this reads as a paper.
sections:
  - { id: hero,          nav: null,          enabled: true }
  - { id: abstract,      nav: Overview,      enabled: true }
  - { id: architecture,  nav: Architecture,  enabled: true }
  - { id: preprocessing, nav: Preprocessing, enabled: true }
  - { id: explorer,      nav: Explorer,      enabled: true }
  - { id: results,       nav: Results,       enabled: true }
  - { id: showcase,      nav: Components,    enabled: true }
  - { id: resources,     nav: Resources,     enabled: true }
