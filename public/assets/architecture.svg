<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Demo architecture figure (MorphoNet-18 3D-CNN). Replace public/assets/architecture.svg
       with your own paper figure (PNG/JPG/SVG) — see content/architecture.md. -->
  <rect x="6" y="6" width="1028" height="288" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#cbd5e1" stroke-width="2" marker-end="url(#arw)">
    <line x1="128" y1="150" x2="150" y2="150"/>
    <line x1="235" y1="150" x2="257" y2="150"/>
    <line x1="342" y1="150" x2="364" y2="150"/>
    <line x1="449" y1="150" x2="471" y2="150"/>
    <line x1="556" y1="150" x2="578" y2="150"/>
    <line x1="663" y1="150" x2="685" y2="150"/>
    <line x1="770" y1="150" x2="800" y2="150"/>
    <line x1="862" y1="150" x2="890" y2="150"/>
  </g>

  <!-- input (dashed) -->
  <rect x="44" y="104" width="80" height="92" rx="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="84" y="146" text-anchor="middle" font-size="14" fill="#64748b">input</text>
  <text x="84" y="230" text-anchor="middle" font-size="13" fill="#64748b">T1 MRI · 182³</text>

  <!-- conv blocks: fill deepens with channel count; dark labels stay on a light fill -->
  <g stroke="#0d748a" stroke-width="1.5">
    <rect x="151" y="104" width="80" height="92" rx="10" fill="#0d748a" fill-opacity="0.14"/>
    <rect x="258" y="104" width="80" height="92" rx="10" fill="#0d748a" fill-opacity="0.18"/>
    <rect x="365" y="104" width="80" height="92" rx="10" fill="#0d748a" fill-opacity="0.26"/>
    <rect x="472" y="104" width="80" height="92" rx="10" fill="#0d748a" fill-opacity="0.40"/>
    <rect x="579" y="104" width="80" height="92" rx="10" fill="#0d748a" fill-opacity="0.40"/>
    <rect x="686" y="104" width="80" height="92" rx="10" fill="#0d748a" fill-opacity="0.18"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">
    <text x="191" y="156">32</text>
    <text x="298" y="156">64</text>
    <text x="405" y="156">128</text>
    <text x="512" y="156">256</text>
    <text x="619" y="156">256</text>
    <text x="726" y="156">64</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#64748b">
    <text x="191" y="230">91³</text>
    <text x="298" y="230">45³</text>
    <text x="405" y="230">22³</text>
    <text x="512" y="230">11³</text>
    <text x="619" y="230">5³</text>
    <text x="726" y="230">5³</text>
  </g>

  <!-- global average pool -->
  <circle cx="831" cy="150" r="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="831" y="146" text-anchor="middle" font-size="11" fill="#475569">avg</text>
  <text x="831" y="159" text-anchor="middle" font-size="11" fill="#475569">pool</text>
  <text x="831" y="205" text-anchor="middle" font-size="12" fill="#64748b">global</text>

  <!-- fully-connected head (accent) -->
  <rect x="892" y="120" width="96" height="60" rx="10" fill="#0d748a" fill-opacity="0.16" stroke="#0d748a" stroke-width="1.5"/>
  <text x="940" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">FC → ŷ</text>
  <text x="940" y="205" text-anchor="middle" font-size="12" fill="#64748b">Fluid reasoning (pts)</text>
</svg>
